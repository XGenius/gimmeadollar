name: Record the voice

# Renders every line in assets/script.js with the cloned ElevenLabs voice,
# checks each take by transcribing it back, masters it, and commits
# tools/raw/*.mp3, audio/*.mp3 and audio/manifest.json. Runs when the script
# changes, or by hand from the Actions tab (mode "audit" re-checks every clip).
on:
  workflow_dispatch:
    inputs:
      ids:
        description: Line ids to re-record, space separated (empty = all)
        required: false
        default: ""
      mode:
        description: render (new or listed lines) or audit (transcribe every clip, re-record bad ones)
        required: false
        default: render
  push:
    branches: [main]
    paths: [assets/script.js, tools/voice.json, tools/voice.mjs, .github/workflows/voice.yml]

permissions:
  contents: write

concurrency: voice

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Render clips
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::ELEVENLABS_API_KEY secret is not set, skipping."
            exit 0
          fi
          if [ "${{ github.event.inputs.mode }}" = "audit" ]; then
            node tools/voice.mjs audit
          else
            node tools/voice.mjs render ${{ github.event.inputs.ids }}
          fi
      - name: Commit clips
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audio tools/raw
          git diff --cached --quiet || { git commit -m "Record voice clips"; git push; }
