name: Deploy

# Publishes the site to Cloudflare on every push to main, and again after the
# voice workflow commits new clips (its pushes don't trigger workflows).
# Needs the CLOUDFLARE_API_TOKEN repo secret; skips quietly until it exists.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Record the voice]
    types: [completed]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN secret is not set, skipping deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy
